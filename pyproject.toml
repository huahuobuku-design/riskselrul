[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskselrul"
version = "1.0.0"
description = "Risk-aware selective RUL prediction on NASA C-MAPSS with an honest evaluation protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "riskselrul contributors" }]
keywords = [
    "remaining useful life",
    "selective prediction",
    "C-MAPSS",
    "prognostics and health management",
    "uncertainty quantification",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "threadpoolctl>=3.1",
    "matplotlib>=3.8",
]

[project.scripts]
riskselrul = "riskselrul.cli:main"

[project.urls]
Repository = "https://github.com/huahuobuku-design/riskselrul"

[tool.setuptools.packages.find]
where = ["src"]
