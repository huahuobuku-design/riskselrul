[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskselrul"
version = "0.1.0"
description = "Reproducible sensor-fault benchmarks and selective remaining useful life diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24,<3"]
keywords = ["remaining useful life", "selective regression", "C-MAPSS", "reproducibility"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
train = ["pandas>=2,<4", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "threadpoolctl>=3,<4"]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
riskselrul = "riskselrul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskselrul = ["_legacy/*.json", "assets/*.json", "assets/states/*.npz", "assets/states/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
