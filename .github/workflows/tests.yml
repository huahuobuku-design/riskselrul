name: SoftwareX candidate tests
on:
  push:
    branches: [softwarex-dev]
  pull_request:
    branches: [softwarex-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training and test dependencies
        run: python -m pip install ".[train,dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed version and location
        run: python -c "import riskselrul; print(riskselrul.__file__); assert riskselrul.__version__ == '0.1.1.dev0'; assert 'site-packages' in riskselrul.__file__"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Command line entry
        run: python -m riskselrul --help
      - name: Array example
        run: python examples/quickstart_arrays.py --out ci_array_output
      - name: General regression example
        run: python examples/04_generic_regression.py --out ci_generic_output
