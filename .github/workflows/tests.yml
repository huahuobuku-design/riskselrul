name: Validated 0.1.0 package tests
on:
  push:
    branches: [validated-0.1.0]
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[train,dev]"
      - run: python -m pytest -q
      - run: python -m riskselrul --help
      - run: python examples/quickstart_arrays.py --out ci_example_output
