name: SoftwareX candidate tests
on:
  push:
    branches: [softwarex-dev]
  pull_request:
    branches: [softwarex-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install training and test dependencies
        run: python -m pip install ".[train,dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed version and location
        run: python -c "import riskselrul; print(riskselrul.__file__); assert riskselrul.__version__ == '0.1.1.dev0'; assert 'site-packages' in riskselrul.__file__"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Command line entry
        run: python -m riskselrul --help
      - name: Array example
        run: python examples/quickstart_arrays.py --out ci_array_output
      - name: General regression example
        run: python examples/04_generic_regression.py --out ci_generic_output
      - name: Self-designed user tasks
        run: python examples/05_user_tasks.py --out ci_user_tasks
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: [FD001, FD003]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from source in fresh runner
        run: python -m pip install '.[train,dev]'
      - name: Build and install wheel
        shell: bash
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import riskselrul; print(riskselrul.__file__); assert 'site-packages' in riskselrul.__file__"
      - name: Download, strictly inspect, train and audit
        run: python scripts/cold_start.py --dataset ${{ matrix.dataset }} --out cold_start
      - name: Preserve execution evidence without raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-${{ matrix.dataset }}
          path: |
            cold_start/*.json
            cold_start/*.log
            cold_start/run/
          if-no-files-found: warn
