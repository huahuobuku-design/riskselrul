name: reviewed-package-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [github-1.0.0, validated-0.1.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GitHub profile and run standard-library tests
        if: matrix.profile == 'github-1.0.0'
        shell: bash
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m riskselrul --help
          riskselrul --help
      - name: Verify and test the separate validated alpha profile
        if: matrix.profile == 'validated-0.1.0'
        shell: bash
        run: |
          python -c "import hashlib,pathlib; p=pathlib.Path('validation_inputs/riskselrul-0.1.0.tar.gz'); assert hashlib.sha256(p.read_bytes()).hexdigest()=='86f8d015f02dccdc90bc0a439b87b1a6c377153208288e9b6a008b45cbf56117'"
          python -c "import tarfile; tarfile.open('validation_inputs/riskselrul-0.1.0.tar.gz').extractall('validated_alpha', filter='data')"
          python -m pip install './validated_alpha/riskselrul-0.1.0[train,dev]'
          python -m pytest validated_alpha/riskselrul-0.1.0/tests -q
          python -m riskselrul --version
          riskselrul --version
      - name: Record installed versions
        if: always()
        run: python -m pip list
